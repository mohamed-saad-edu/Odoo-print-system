name: Security and Resilience Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 0'  # Re-evaluate dependency advisories weekly

permissions:
  contents: read


jobs:
  changes:
    name: Relevant change scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      supply: ${{ steps.scope.outputs.supply }}
      postgres: ${{ steps.scope.outputs.postgres }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Classify changed files (fail open)
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-change-scopes.sh
  supply-chain:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.supply == 'true'
    # Cancel only an eligible duplicate job, never on an unrelated push.
    concurrency:
      group: security-supply-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.98.1
        with:
          toolchain: 1.98.1

      - name: Restore vulnerability scanner cache
        id: security-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/govulncheck
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-security-tools-govulncheck-1.8.0-cargo-audit-0.22.2

      - name: npm dependency audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-gate.mjs

      - name: Verify npm high-severity audit gate with known vulnerable fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cat > "$fixture/package.json" <<'EOF'
          {
            "name": "yaseir-audit-gate-fixture",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "lodash": "4.17.19"
            }
          }
          EOF
          (cd "$fixture" && npm install --package-lock-only --ignore-scripts >/dev/null)
          set +e
          audit_output="$(cd "$fixture" && npm audit --audit-level=high 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -eq 0 ]; then
            echo "Expected npm audit to fail for the known high-severity fixture."
            exit 1
          fi
          echo "Known vulnerable fixture correctly caused npm audit --audit-level=high to fail."

      - name: Go vulnerability scan (pinned)
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          scanner="$(go env GOPATH)/bin/govulncheck"
          if [ ! -x "$scanner" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          fi
          "$scanner" ./...

      - name: Rust vulnerability scan
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          cargo audit --target-os windows --target-arch x86_64
      - name: Save vulnerability scanner cache
        if: github.event_name != 'pull_request' && steps.security-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/govulncheck
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-security-tools-govulncheck-1.8.0-cargo-audit-0.22.2

      - name: Verify container image references are immutable
        shell: bash
        run: |
          set -euo pipefail

          # Every explicit YAML image: value must be immutable. The old grep
          # pattern only matched refs that already contained a tag, so a
          # digest-less value such as "image: registry.example/tool" escaped
          # the gate entirely.
          if awk '
            /^[[:space:]]*image:[[:space:]]*/ {
              image = $0
              sub(/^[[:space:]]*image:[[:space:]]*/, "", image)
              sub(/[[:space:]]+#.*$/, "", image)
              # GitHub Actions matrix "image:" is a mapping/list key, not a
              # scalar container image reference; only check actual values.
              if (image == "") next
              if (image !~ /@sha256:[0-9a-fA-F]{64}$/) {
                print FILENAME ":" FNR ": unpinned image reference: " image
                bad = 1
              }
            }
            END { exit bad ? 1 : 0 }
          ' docker-compose.yml docker-compose.ci.yml .github/workflows/*.yml; then
            :
          else
            echo 'Unpinned container image reference detected; pin every YAML image: value by digest.'
            exit 1
          fi

          # Keep the existing protection for Docker CLI commands such as
          # docker pull/run when the image is written directly on the command
          # line.
          if grep -RInE 'docker (pull|run)[[:space:]]+[^#[:space:]]*:[A-Za-z0-9._-]+([[:space:]]|$)' Dockerfile docker-compose.yml .github/workflows | grep -v '@sha256:'; then
            echo 'Unpinned Docker CLI image reference detected.'
            exit 1
          fi

          echo 'All Dockerfile/Compose/CI container image references are digest-pinned.'

      - name: Verify committed lockfiles and immutable build commands
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          test -s agent/go.sum
          test -s src-tauri/Cargo.lock
          ! grep -RInE '(^|[[:space:]])npm install([[:space:]]|$)' Dockerfile .github/workflows/ci.yml .github/workflows/build-windows.yml .github/workflows/docker.yml
          grep -RInE 'go (mod verify|build.*-mod=readonly|vet.*-mod=readonly|test -mod=readonly)' .github/workflows/ci.yml .github/workflows/build-windows.yml
          grep -RInE 'cargo (build|check|test).*--locked' .github/workflows/build-windows.yml
          echo "package-lock.json, agent/go.sum, and src-tauri/Cargo.lock are present."
          echo "Build pipelines use npx --yes npm@12.2.1 ci, Go module verification/read-only mode, and Cargo --locked."

      - name: Verify all third-party GitHub Actions are SHA pinned
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*uses:[[:space:]]*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@' .github/workflows \
            | grep -vE '@[0-9a-fA-F]{40}([[:space:]]+#.*)?$'; then
            echo 'Unpinned GitHub Action reference detected. Use an immutable 40-character commit SHA with a version comment.'
            exit 1
          fi
          echo 'All third-party workflow action references are immutable SHA pins.'

  postgres-failure-injection:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.postgres == 'true'
    # Cancel only an eligible duplicate job, never on an unrelated push.
    concurrency:
      group: security-postgres-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start pinned PostgreSQL with rate-limit-only registry fallback
        shell: bash
        env:
          CI_PG_USER: postgres
          CI_PG_PASSWORD: postgres
          CI_PG_DATABASE: app_db
        run: bash scripts/ci-postgres.sh start
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npx --yes npm@12.2.1 ci --prefer-offline --no-audit --fund=false
      - name: Run migrations
        run: npm run db:migrate
      - name: PostgreSQL LISTEN reconnect failure injection
        run: npx tsx scripts/pg-notify-failure-injection.ts
      - name: Stop temporary CI PostgreSQL
        if: always()
        run: bash scripts/ci-postgres.sh stop
