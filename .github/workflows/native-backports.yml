name: Native Backport Safety

on:
  push:
    branches: [main, test/http-server-ready]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Preserve running main verification while retaining only the latest pending
# push for this workflow. Never coalesce manual or merge-queue release gates.
# PR retries may cancel older attempts of the same PR only.
concurrency:
  group: native-backports-run-${{ github.event_name == 'push' && github.ref || github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gtk-backports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.98.1
        with:
          toolchain: 1.98.1
      - name: Native GLib test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-dev pkg-config
      - name: Verify backport provenance and resolved local graph
        run: python3 scripts/check-native-backports.py
      - name: Optimized GLib behavior and upstream macro tests
        run: cargo test --manifest-path src-tauri/native-regressions/Cargo.toml --locked --release --tests
      - name: Real macro error diagnostics without abandoned packages
        run: python3 scripts/test-native-macro-diagnostics.py
